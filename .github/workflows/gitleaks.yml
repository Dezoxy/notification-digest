name: CI / Secret Scan
on:
  # Deliberately not path-filtered: this check must report on every PR.
  pull_request:
  # Post-merge safety net: PR checks can be merged past while still pending.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a main validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          # sha256 of gitleaks_${version}_linux_x64.tar.gz, from the release's
          # gitleaks_${version}_checksums.txt. Update both together.
          sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --verbose --config .gitleaks.toml
