name: azure-validate

# Deliberately not path-filtered: a required check that does not report blocks a
# PR forever, and this job is a required status check on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/azure
      - run: terraform -chdir=infra/azure init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/azure validate
