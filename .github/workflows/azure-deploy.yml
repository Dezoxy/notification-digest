name: azure-deploy

on:
  # A merged image-pin bump (Renovate or a revert) deploys through release-apply
  # below, which refuses anything that is not a pure image bump of every job.
  push:
    branches: [main]
    paths: ['infra/azure/image.auto.tfvars.json']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Plan a change, or apply a plan that was already reviewed
        options: [plan, apply]
        default: plan
        required: true
      plan_run_id:
        type: string
        description: Run ID of the reviewed plan run; required for apply
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: notification-digest-azure
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'plan')
    runs-on: ubuntu-latest
    environment: azure-plan
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
      TFVARS_JSON: ${{ vars.AZURE_TERRAFORM_VARS_JSON }}
      BACKEND_JSON: ${{ vars.AZURE_TERRAFORM_BACKEND_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.16.5
          terraform_wrapper: false
      - name: Validate and write reviewed backend and nonsecret configuration
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          for name in ('ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID'):
              if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', os.environ.get(name, '')):
                  raise SystemExit(f'{name} must be configured with an Azure UUID.')
          try:
              values = json.loads(os.environ['TFVARS_JSON'])
              backend = json.loads(os.environ['BACKEND_JSON'])
          except (KeyError, ValueError):
              raise SystemExit('Configure valid AZURE_TERRAFORM_VARS_JSON and AZURE_TERRAFORM_BACKEND_JSON objects.')
          if not isinstance(values, dict) or not isinstance(backend, dict):
              raise SystemExit('Terraform application and backend configuration must be JSON objects.')
          # production.auto.tfvars.json loads after image.auto.tfvars.json and would
          # silently override the tracked pin, so the variable must not carry an image.
          try:
              pin = json.loads(Path('infra/azure/image.auto.tfvars.json').read_text())['image']
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('The tracked image pin infra/azure/image.auto.tfvars.json is missing or malformed.')
          if 'image' in values:
              if values['image'] != pin:
                  raise SystemExit('AZURE_TERRAFORM_VARS_JSON sets an image that differs from the tracked pin in infra/azure/image.auto.tfvars.json; remove image from AZURE_TERRAFORM_VARS_JSON.')
              print('::warning::AZURE_TERRAFORM_VARS_JSON still sets image (equal to the tracked pin). It is ignored; remove it from the variable.')
              del values['image']
          required = {'resource_group_name', 'storage_account_name', 'container_name', 'key'}
          if set(backend) != required or not all(isinstance(v, str) for v in backend.values()):
              raise SystemExit('Backend configuration must contain only resource_group_name, storage_account_name, container_name and key.')
          patterns = {
              'resource_group_name': r'[A-Za-z0-9_-]{1,90}',
              'storage_account_name': r'[a-z0-9]{3,24}',
              'container_name': r'[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])',
              'key': r'notification-digest\.tfstate',
          }
          if not all(re.fullmatch(patterns[k], v) for k, v in backend.items()) or '--' in backend['container_name']:
              raise SystemExit('Backend location is invalid; use the separately bootstrapped container and notification-digest.tfstate key.')
          app_accounts = {values.get('storage_account_name'), values.get('backup_storage_account_name')}
          app_groups = {values.get('resource_group_name', 'notification-digest-westeurope'), values.get('backup_resource_group_name', 'notification-digest-backups-westeurope')}
          if backend['storage_account_name'] in app_accounts or backend['resource_group_name'].lower() in {str(group).lower() for group in app_groups}:
              raise SystemExit('Terraform backend must use a separate resource group and storage account from runtime state and backups.')
          Path('infra/azure/backend.hcl').write_text(''.join(f'{k} = {json.dumps(v)}\n' for k, v in sorted(backend.items())))
          Path('infra/azure/production.auto.tfvars.json').write_text(json.dumps(values))
          PY
      - run: terraform -chdir=infra/azure init -input=false -lockfile=readonly -backend-config=backend.hcl
      - run: terraform -chdir=infra/azure plan -input=false -no-color -out=deployment.tfplan
      - name: Write reviewable plan
        run: terraform -chdir=infra/azure show -no-color deployment.tfplan > infra/azure/deployment-plan.txt
      - uses: actions/upload-artifact@v7
        with:
          name: azure-plan-${{ github.run_id }}
          path: |
            infra/azure/deployment.tfplan
            infra/azure/deployment-plan.txt
            infra/azure/production.auto.tfvars.json
            infra/azure/backend.hcl
          retention-days: 1
      - name: Release deploy note
        if: github.event_name == 'push'
        run: echo 'The guarded release-apply job handles this plan; if it refuses, use the manual plan and apply.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply instructions
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo 'Review the azure-plan artifact and plan output, then apply this exact saved plan with:'
            echo
            echo '```sh'
            echo "gh workflow run azure-deploy.yml --ref main -f operation=apply -f plan_run_id=$GITHUB_RUN_ID"
            echo '```'
            echo
            echo 'Schedule activation can replace job resources; Blob state is protected.'
            echo 'The plan artifact expires after one day; run a new plan after that.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    # Approval is the owner dispatching apply with the run ID of the reviewed
    # plan; the verification step ties that run to this commit.
    # Azure federated credentials must independently restrict this environment;
    # both environments are restricted to main by deployment branch policy.
    environment: azure-production
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.16.5
          terraform_wrapper: false
      - name: Require a successful reviewed plan run from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          python - <<'PY'
          import os, re
          run_id = os.environ.get('PLAN_RUN_ID', '')
          if not re.fullmatch(r'[0-9]{1,20}', run_id):
              raise SystemExit('plan_run_id must be the numeric run ID of the reviewed plan run.')
          if run_id == os.environ['GITHUB_RUN_ID']:
              raise SystemExit('plan_run_id must be a previous plan run, not this apply run.')
          PY
          gh api "repos/$GH_REPO/actions/runs/$PLAN_RUN_ID" \
            --jq '{path, event, head_branch, head_sha, status, conclusion}' \
            > "$RUNNER_TEMP/plan-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'plan-run.json').read_text())
          expected = {
              'path': '.github/workflows/azure-deploy.yml',
              'event': 'workflow_dispatch',
              'head_branch': 'main',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'success',
          }
          for key, want in expected.items():
              if run.get(key) != want:
                  raise SystemExit(f'plan run {key} is {run.get(key)!r}, expected {want!r}; apply refused.')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: azure-plan-${{ inputs.plan_run_id }}
          path: infra/azure
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - run: terraform -chdir=infra/azure init -input=false -lockfile=readonly -backend-config=backend.hcl
      - run: terraform -chdir=infra/azure apply -input=false deployment.tfplan

  release-apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Applies the plan this run just produced, but only if scripts/azure_release_guard.py
    # finds it to be a pure image bump of every job. Anything else fails the job
    # and the owner uses the manual plan/apply path. Each step fails closed.
    environment: azure-production
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.16.5
          terraform_wrapper: false
      - uses: actions/download-artifact@v8
        with:
          name: azure-plan-${{ github.run_id }}
          path: infra/azure
      - run: terraform -chdir=infra/azure init -input=false -lockfile=readonly -backend-config=backend.hcl
      - name: Accept only an image-only bump of every job
        id: guard
        run: |
          terraform -chdir=infra/azure show -json deployment.tfplan > "$RUNNER_TEMP/plan.json"
          python3 scripts/azure_release_guard.py plan-check "$RUNNER_TEMP/plan.json" infra/azure/image.auto.tfvars.json
      - name: Wait for the pinned image to exist in GHCR
        if: steps.guard.outputs.decision == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(python3 -c 'import json; print(json.load(open("infra/azure/image.auto.tfvars.json"))["image"])')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for _attempt in $(seq 1 40); do
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "Found $image"
              exit 0
            fi
            echo "Waiting for $image"
            sleep 30
          done
          echo "::error::$image did not appear in GHCR within 20 minutes; use the manual path once release.yml has published it."
          exit 1
      - uses: azure/login@v3
        if: steps.guard.outputs.decision == 'apply'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Wait until no job is running or about to fire
        if: steps.guard.outputs.decision == 'apply'
        run: python3 scripts/azure_release_guard.py wait-idle "$RUNNER_TEMP/plan.json"
      - name: Apply the guarded plan
        if: steps.guard.outputs.decision == 'apply'
        run: terraform -chdir=infra/azure apply -input=false deployment.tfplan
