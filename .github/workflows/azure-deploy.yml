name: azure-deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Plan only, or plan followed by approval of the saved plan
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: notification-digest-azure
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-plan
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
      TFVARS_JSON: ${{ vars.AZURE_TERRAFORM_VARS_JSON }}
      BACKEND_JSON: ${{ vars.AZURE_TERRAFORM_BACKEND_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Validate and write reviewed backend and nonsecret configuration
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          for name in ('ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID'):
              if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', os.environ.get(name, '')):
                  raise SystemExit(f'{name} must be configured with an Azure UUID.')
          try:
              values = json.loads(os.environ['TFVARS_JSON'])
              backend = json.loads(os.environ['BACKEND_JSON'])
          except (KeyError, ValueError):
              raise SystemExit('Configure valid AZURE_TERRAFORM_VARS_JSON and AZURE_TERRAFORM_BACKEND_JSON objects.')
          if not isinstance(values, dict) or not isinstance(backend, dict):
              raise SystemExit('Terraform application and backend configuration must be JSON objects.')
          required = {'resource_group_name', 'storage_account_name', 'container_name', 'key'}
          if set(backend) != required or not all(isinstance(v, str) for v in backend.values()):
              raise SystemExit('Backend configuration must contain only resource_group_name, storage_account_name, container_name and key.')
          patterns = {
              'resource_group_name': r'[A-Za-z0-9_-]{1,90}',
              'storage_account_name': r'[a-z0-9]{3,24}',
              'container_name': r'[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])',
              'key': r'notification-digest\.tfstate',
          }
          if not all(re.fullmatch(patterns[k], v) for k, v in backend.items()) or '--' in backend['container_name']:
              raise SystemExit('Backend location is invalid; use the separately bootstrapped container and notification-digest.tfstate key.')
          if backend['storage_account_name'] == values.get('storage_account_name') or backend['resource_group_name'] == values.get('resource_group_name', 'notification-digest-westeurope'):
              raise SystemExit('Terraform backend must use a separate resource group and storage account from runtime state.')
          Path('infra/azure/backend.hcl').write_text(''.join(f'{k} = {json.dumps(v)}\n' for k, v in sorted(backend.items())))
          Path('infra/azure/production.auto.tfvars.json').write_text(json.dumps(values))
          PY
      - run: terraform -chdir=infra/azure init -input=false -lockfile=readonly -backend-config=backend.hcl
      - run: terraform -chdir=infra/azure plan -input=false -no-color -out=deployment.tfplan
      - name: Write reviewable plan
        run: terraform -chdir=infra/azure show -no-color deployment.tfplan > infra/azure/deployment-plan.txt
      - uses: actions/upload-artifact@v7
        with:
          name: azure-plan-${{ github.run_id }}
          path: |
            infra/azure/deployment.tfplan
            infra/azure/deployment-plan.txt
            infra/azure/production.auto.tfvars.json
            infra/azure/backend.hcl
          retention-days: 1
      - name: Approval instructions
        run: |
          echo 'Review the azure-plan artifact and plan output before approving azure-production.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The apply job uses this exact saved plan. Schedule activation can replace job resources; Blob state is protected.' >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    # Configure required reviewers in repository settings; verified below.
    # Azure federated credentials must independently restrict this environment.
    environment: azure-production
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: actions/download-artifact@v8
        with:
          name: azure-plan-${{ github.run_id }}
          path: infra/azure
      - name: Require configured approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/azure-production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' \
            > "$RUNNER_TEMP/approval-gate.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          if json.loads(Path(os.environ['RUNNER_TEMP'], 'approval-gate.json').read_text()) is not True:
              raise SystemExit('azure-production must have required reviewers configured before applying.')
          PY
      - run: terraform -chdir=infra/azure init -input=false -lockfile=readonly -backend-config=backend.hcl
      - run: terraform -chdir=infra/azure apply -input=false deployment.tfplan
