name: pr-summary

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re)generate"
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine PR number
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          mkdir -p docs/pr-summaries
          python3 scripts/pr_summary.py "$PR_NUMBER" --markdown > docs/pr-summaries/pr-"$PR_NUMBER".md

      - name: Commit and push
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-summaries/pr-"$PR_NUMBER".md
          git diff --staged --quiet || {
            git commit -m "docs: PR #$PR_NUMBER summary"
            attempt=1
            until git push; do
              if [ "$attempt" -ge 3 ]; then
                echo "git push rejected after $attempt attempts" >&2
                exit 1
              fi
              echo "git push rejected (attempt $attempt); rebasing onto origin/main and retrying" >&2
              git pull --rebase origin main
              attempt=$((attempt + 1))
            done
          }
