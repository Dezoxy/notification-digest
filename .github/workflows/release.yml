name: release

on:
  push:
    tags:
      - 'v*'
  # auto-release.yml calls this directly: a tag created with the built-in token
  # does not trigger the tag push above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.29.1
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A tag push builds the pushed tag; a call builds the tag it was given.
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dezoxy/notification-digest
          # value= makes a workflow_call build the called tag; on a tag push the
          # ref name is that tag, which is what the action would have used anyway.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
          # No floating `latest` tag: the homelab repo pins an exact version
          # per PLAN.md §6/§7, so there's nothing that would ever consume it.
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        env:
          # The repository is public: skip uploading the .dockerbuild build-record
          # artifact, which anyone could download. Documented in
          # docker/build-push-action v7 "Environment variables".
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
