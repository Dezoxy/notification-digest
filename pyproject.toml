[project]
name = "digest"
version = "0.1.0"
description = "Personal Telegram/X notification-digest service"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    # Maintained fork of the dead upstream `twikit` (2.3.3, Feb 2025): X
    # changed their webpack bundle in March 2026, breaking twikit's
    # transaction-ID signing before any auth could even be attempted
    # ("Couldn't get KEY_BYTE indices"). `twifork` 2.3.5 fixes exactly that
    # and still imports as `twikit` -- no import lines change anywhere in
    # this codebase (see digest/collectors/x.py's module docstring). Pinned
    # to an EXACT version deliberately: this is a single-maintainer fork
    # handling a live session cookie, so there is no automatic version
    # drift here -- bump only after re-auditing the diff against the
    # previous pin, same as the audit this pin followed (no new network
    # hosts, no new eval/exec/base64/subprocess/pickle).
    "twifork==2.4.0",
    "markdown>=3.7",
    "nh3>=0.2",
    "python-dotenv>=1.0",
    # Battle-tested RSS/Atom parsing across malformed real-world feeds;
    # stdlib XML parsing would mean hand-rolling namespace/date/encoding
    # tolerance ourselves.
    "feedparser>=6.0",
    # Azure SDKs own Blob leases/snapshots and managed identity; no workflow framework.
    "azure-storage-blob>=12.31.0",
    "azure-identity>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    # js2py (a twikit dependency) triggers a py3.12 co_lnotab deprecation at
    # import time — third-party noise, silenced so real warnings stay visible.
    "ignore:co_lnotab is deprecated:DeprecationWarning:js2py_.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
