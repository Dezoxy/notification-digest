[project]
name = "digest"
version = "0.1.0"
description = "Personal Telegram/X notification-digest service"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "twikit>=2.3",
    "markdown>=3.7",
    "nh3>=0.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    # js2py (a twikit dependency) triggers a py3.12 co_lnotab deprecation at
    # import time — third-party noise, silenced so real warnings stay visible.
    "ignore:co_lnotab is deprecated:DeprecationWarning:js2py_.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
